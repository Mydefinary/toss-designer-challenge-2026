# MEETSYNC 독립 백엔드 (선택) — 포트 8010 노출
#
# DB 는 정치불신 MariaDB 컨테이너를 재사용한다(별도 DB 컨테이너를 띄우지 않음).
# 아래 두 가지 접속 방식 중 하나를 택한다:
#
# (A) 호스트 포트로 접속 (기본, 가장 간단)
#     - 정치불신 MariaDB 가 호스트 127.0.0.1:3306 에 포트 매핑되어 있어야 한다.
#     - 컨테이너에서 호스트로 나가려면 host.docker.internal 을 쓴다.
#       DATABASE_URL=mysql+pymysql://<user>:<pw>@host.docker.internal:3306/meetsync?charset=utf8mb4
#     - Linux 에서는 아래 extra_hosts 주석을 해제해야 host.docker.internal 이 동작한다.
#
# (B) 정치불신 도커 네트워크에 직접 합류 (같은 compose 네트워크 공유)
#     - 정치불신 MariaDB 서비스가 붙어 있는 외부 네트워크를 지정하고,
#       DATABASE_URL 의 host 를 그 컨테이너 서비스명(예: mariadb)으로 둔다.
#       DATABASE_URL=mysql+pymysql://<user>:<pw>@mariadb:3306/meetsync?charset=utf8mb4
#     - 아래 networks 의 external 블록 주석을 해제하고 실제 네트워크명으로 교체.

services:
  meetsync-backend:
    build: .
    ports:
      - "8010:8010"
    env_file:
      - .env
    restart: unless-stopped
    # (A) Linux 에서 host.docker.internal 사용 시 주석 해제:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # (B) 정치불신 네트워크 합류 시 주석 해제:
    # networks:
    #   - lowpolitics_net

# (B) 외부 네트워크 사용 시 주석 해제하고 실제 네트워크명으로 교체:
# networks:
#   lowpolitics_net:
#     external: true
#     name: <정치불신_compose_네트워크명>
